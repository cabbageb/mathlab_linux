name: Linux CLI checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests_linux
      - run: python -m compileall -q provider_config.py mathlab_linux_cli.py core planner prover
      - run: node --check browser/app.js
      - run: node --check browser/login.js
