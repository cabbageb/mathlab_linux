[search]
theorem_primary_endpoint = "https://api.theoremsearch.com/search"
theorem_fallback_endpoint = "https://leansearch.net/thm/search"
arxiv_api_endpoint = "https://export.arxiv.org/api/query"
max_results = 8
timeout_seconds = 45
max_literature_theorem_searches = 1
max_literature_arxiv_searches = 2
max_literature_abstracts = 5
max_literature_papers = 1

[publication_literature]
enabled = true
theorem_searches = 6
arxiv_searches = 6
abstract_candidates = 30
fulltext_papers = 4
abstract_keep = 5
