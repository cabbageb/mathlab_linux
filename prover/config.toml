[application]
role_call_timeout_seconds = 1800
paper_writer_timeout_seconds = 2400
paper_writer_warning_remaining_seconds = 600

[codex]
binary = "codex"
provider = "custom_provider"
base_url = "https://api.example.com/v1"
api_key_env = "MATHLAB_PROVIDER_API_KEY"
history_persistence = "save-all"
model_catalog = "model_catalog.json"
model_auto_compact_token_limit = 800000

[models.research_literature]
model = "deepseek-v4-pro"
reasoning_effort = "max"
[models.research_construction]
model = "deepseek-v4-pro"
reasoning_effort = "max"
[models.research_general_proof]
model = "deepseek-v4-pro"
reasoning_effort = "max"
[models.research_cross_domain]
model = "deepseek-v4-pro"
reasoning_effort = "max"
[models.research_node_supervisor]
model = "gpt-5.6-sol"
reasoning_effort = "high"
[models.research_architecture_reviewer]
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
[models.research_claim_verifier]
model = "gpt-5.6-sol"
reasoning_effort = "high"
[models.paper_writer]
model = "gpt-5.6-sol"
reasoning_effort = "high"
[models.paper_auditor]
model = "gpt-5.6-sol"
reasoning_effort = "high"
[models.public_summarizer]
model = "gpt-5.6-luna"
reasoning_effort = "medium"

# Execution Policy profiles.  Contract approval resolves one profile into an
