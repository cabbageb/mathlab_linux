[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "math-lab"
version = "0.3.0"
description = "MathLab — Contract-first AI-assisted mathematical research"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "alembic>=1.14",
  "python-dotenv>=1.0",
  "tomli>=2.0; python_version < '3.11'",
  "email-validator>=2.2",
  "PySocks>=1.7.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pyyaml>=6.0", "playwright>=1.50"]

[project.scripts]
math-lab = "math_lab_cli:main"
math-lab-runner = "runner_cli:main"
mathlab-linux = "mathlab_linux_cli:main"

[tool.setuptools]
py-modules = ["math_lab_cli", "runner_cli", "mathlab_linux_cli", "provider_config"]

[tool.setuptools.packages.find]
where = ["core/src", "planner/src", "prover/src"]
include = ["math_lab_core*", "math_planner*", "math_prover*"]

[tool.pytest.ini_options]
pythonpath = ["core/src", "planner/src", "prover/src"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
