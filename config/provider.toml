# User-editable provider configuration for the Linux CLI.
# The API key is read from the environment variable named below and is never
# stored in this file.

[provider]
provider = "advancedsolver"
base_url = "https://oneapi.advancedsolver.com/v1"
api_key_env = "ADVANCEDSOLVER_API_KEY"
wire_api = "responses"
default_model = "gpt-6.1-sol"
default_reasoning_effort = "high"
model_context_window = 1000000
model_auto_compact_token_limit = 800000
supported_reasoning_levels = ["low", "medium", "high", "xhigh", "max"]

# These defaults target the AdvancedSolver Responses endpoint. Replace the
# provider block and model tags if you use another compatible provider.
[profiles.low]
model = "gpt-6-luna"
reasoning_effort = "max"

[profiles.medium]
model = "gpt-6.1-sol"
reasoning_effort = "high"

[profiles.high]
model = "gpt-6.1-sol"
reasoning_effort = "xhigh"

# Optional component/role overrides use the existing MathLab role names.
# Example:
# [models.planner.contractor]
# model = "your-contract-model"
# reasoning_effort = "xhigh"
