# User-editable provider configuration for the Linux CLI.
# The API key is read from the environment variable named below and is never
# stored in this file.

[provider]
provider = "custom_provider"
base_url = "https://api.example.com/v1"
api_key_env = "MATHLAB_PROVIDER_API_KEY"
wire_api = "responses"
default_model = "your-model-medium"
default_reasoning_effort = "high"
model_context_window = 1000000
model_auto_compact_token_limit = 800000
supported_reasoning_levels = ["low", "medium", "high", "xhigh", "max"]

# These defaults are deliberately placeholders. Replace them with the model
# tags exposed by your provider. All three profiles are applied to every role
# unless a component-specific override is supplied below.
[profiles.low]
model = "your-model-low"
reasoning_effort = "high"

[profiles.medium]
model = "your-model-medium"
reasoning_effort = "high"

[profiles.high]
model = "your-model-high"
reasoning_effort = "xhigh"

# Optional component/role overrides use the existing MathLab role names.
# Example:
# [models.planner.contractor]
# model = "your-contract-model"
# reasoning_effort = "xhigh"
